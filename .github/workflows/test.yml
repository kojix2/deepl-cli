name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ubuntu
    runs-on: ubuntu-latest

    env:
      # deepl-mock package version 1.21.0. Update this revision to upgrade.
      DEEPL_MOCK_REVISION: 6e14679feed9d4f87741727e31cb5fb9d64e0d34
      DEEPL_SERVER_URL: http://127.0.0.1:3000
      DEEPL_AUTH_KEY: cli-integration-${{ github.run_id }}
      NO_PROXY: 127.0.0.1,localhost

    steps:
      - uses: actions/checkout@v7

      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: shards install --without-development

      - name: Install pinned deepl-mock
        run: |
          git clone https://github.com/DeepLcom/deepl-mock.git "$RUNNER_TEMP/deepl-mock"
          git -C "$RUNNER_TEMP/deepl-mock" checkout --detach "$DEEPL_MOCK_REVISION"
          npm ci --prefix "$RUNNER_TEMP/deepl-mock"

      - name: Start deepl-mock
        run: |
          mock_log="$RUNNER_TEMP/deepl-mock.log"
          (
            cd "$RUNNER_TEMP/deepl-mock"
            exec env \
              DEEPL_MOCK_SERVER_PORT=3000 \
              VALIDATE_REQUESTS=1 \
              node index.js
          ) >"$mock_log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/deepl-mock.pid"

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat "$mock_log"
            exit 1
          fi

      - name: Run tests
        run: crystal spec

      - name: Build executable
        run: shards build

      - name: Run executable (version/help/usage)
        run: |
          set -eux
          bin/deepl --version
          bin/deepl -v
          bin/deepl --help
          bin/deepl -h
          bin/deepl --usage
          bin/deepl -u

      - name: Run executable (translate text)
        run: |
          set -eux
          bin/deepl -i "proton beam" -f EN -t DE
          bin/deepl --input "proton beam" --from EN --to DE
          cat spec/fixtures/proton_beams.txt | bin/deepl -f EN -t DE
          bin/deepl -f EN -t DE < spec/fixtures/proton_beams.txt
          bin/deepl -f EN -t DE -i "proton beam" -o translated.txt && cat translated.txt
          bin/deepl -t
          bin/deepl -f

      - name: Run executable (glossary)
        run: |
          set -eux
          bin/deepl glossary list
          crystal eval 'puts "sourceEntry1\ttargetEntry1\nsourceEntry2\ttargetEntry2"' > glossary.tsv
          bin/deepl glossary create -n "Test Glossary" -f EN -t DE glossary.tsv
          bin/deepl glossary list
          bin/deepl glossary view "Test Glossary" -f EN -t DE
          bin/deepl glossary delete "Test Glossary"
          crystal eval 'puts "sourceEntry1,targetEntry1\nsourceEntry2,targetEntry2"' > glossary.csv
          bin/deepl glossary create -n "Test CSV Glossary" -f EN -t DE glossary.csv
          bin/deepl glossary delete "Test CSV Glossary"
          bin/deepl glossary -l
          bin/deepl glossary -h
          bin/deepl glossary list -h
          bin/deepl glossary create -h
          bin/deepl glossary delete -h
          bin/deepl glossary edit -h
          bin/deepl glossary view -h

      - name: Run executable (translate document)
        run: |
          set -eux
          bin/deepl doc spec/fixtures/proton_beams.txt -t DE
          cat spec/fixtures/proton_beams_DE.txt
          test ! -e spec/fixtures/proton_beams.txt.deepl-handle.json

          handle=proton_beams.handle.json
          output=$(bin/deepl doc spec/fixtures/proton_beams.txt -U -t DE --handle "$handle" 2>&1)
          echo "$output"
          test -f "$handle"
          ! echo "$output" | grep -q 'Document Key:'

          bin/deepl doc status --handle "$handle"
          bin/deepl doc download --handle "$handle" -o downloaded_proton_beams_DE.txt
          cat downloaded_proton_beams_DE.txt
          bin/deepl doc -f

      - name: Run executable (rephrase)
        run: |
          set -eux
          bin/deepl rephrase -f EN -i "any input text"
          bin/deepl rephrase -f EN -i "any input text" -D
          cat spec/fixtures/proton_beams.txt | bin/deepl rephrase -f EN -o rephrased_proton_beam.txt
          cat rephrased_proton_beam.txt
          bin/deepl rephrase -f

      - name: Run executable (correct)
        run: |
          set -eux
          bin/deepl correct -f EN -i "any input text"
          bin/deepl correct -f EN-GB -i "any input text"

      - name: Run executable (translation memory)
        run: |
          set -eux
          memory_id=a74d88fb-ed2a-4943-a664-a4512398b994
          bin/deepl memory list --page-size 10
          bin/deepl memory view "$memory_id"
          bin/deepl memory segments --page-size 2 --filter "Nummer 7" --case-sensitive "$memory_id"
          bin/deepl text --from DE --to EN --translation-memory-id "$memory_id" --translation-memory-threshold 75 --input "proton beam"

      - name: Show deepl-mock log
        if: failure()
        run: cat "$RUNNER_TEMP/deepl-mock.log"

      - name: Stop deepl-mock
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/deepl-mock.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/deepl-mock.pid")" 2>/dev/null || true
          fi
